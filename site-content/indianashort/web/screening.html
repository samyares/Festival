  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@700;900&family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <style>
    :root {
      --cream: #faf3e7;
      --cream-card: #fffaf2;
      --ink: #2c1810;
      --ink-soft: #6b5a4e;
      --orange: #ff6b35;
      --orange-soft: #ffe3d6;
      --green: #2f9e6e;
      --sc: 'Playfair Display SC', Georgia, serif;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --sidebar-w: 350px;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
      overflow: hidden;
    }

    /* ── Auto-hiding sidebar ── */

    .edge-zone {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 14px;
      z-index: 32;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: min(88vw, var(--sidebar-w));
      display: flex;
      flex-direction: column;
      background: var(--cream);
      border-right: 2px solid var(--ink);
      box-shadow: 6px 0 0 0 rgba(44, 24, 16, 0.12);
      z-index: 35;
      transform: translateX(-103%);
      transition: transform 0.35s var(--ease);
    }

    body.sb-open .sidebar { transform: translateX(0); }

    .peek {
      position: fixed;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 34;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 0.7rem 0.8rem 0.55rem;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      background: var(--orange);
      border: 2px solid var(--ink);
      border-left: 0;
      border-radius: 0 12px 12px 0;
      box-shadow: 3px 3px 0 0 var(--ink);
      cursor: pointer;
      transition: transform 0.35s var(--ease), opacity 0.25s;
    }

    .peek:hover { padding-left: 0.9rem; }

    body.sb-open .peek { transform: translate(-110%, -50%); opacity: 0; pointer-events: none; }

    .side-head {
      flex-shrink: 0;
      padding: 1rem 1.1rem 0.9rem;
      border-bottom: 2px solid var(--ink);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.7rem;
    }

    .side-head-info { min-width: 0; flex: 1; overflow: hidden; }

    .brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: var(--ink); margin-bottom: 0.75rem; min-width: 0; }
    .brand img { height: 24px; width: auto; display: block; flex-shrink: 0; }
    .brand span {
      font-weight: 700;
      font-size: 0.6rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .side-title { margin: 0; font-family: var(--sc); font-weight: 900; font-size: 1.55rem; line-height: 1.05; }
    .side-title .accent { color: var(--orange); }

    .side-meta { margin: 0.25rem 0 0; font-size: 0.78rem; font-weight: 500; color: var(--ink-soft); }

    .side-close {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      background: var(--cream-card);
      border: 2px solid var(--ink);
      border-radius: 10px;
      box-shadow: 2px 2px 0 0 var(--ink);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .side-close:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 0 var(--ink); }

    .films {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(44, 24, 16, 0.35) transparent;
      padding: 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .film-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      width: 100%;
      padding: 0.55rem 0.7rem;
      background: var(--cream-card);
      border: 2px solid var(--ink);
      border-radius: 12px;
      box-shadow: 3px 3px 0 0 var(--ink);
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .film-row:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 0 var(--ink); }

    .film-row.active { background: var(--orange); color: #fff; }
    .film-row.active .film-cat { color: #fff; opacity: 0.9; }
    .film-row.active .film-no { color: #fff; background: rgba(255, 255, 255, 0.22); border-color: #fff; }

    .film-no {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.85rem;
      height: 1.85rem;
      font-weight: 700;
      font-size: 0.7rem;
      color: var(--ink);
      background: var(--orange-soft);
      border: 2px solid var(--ink);
      border-radius: 8px;
    }

    .film-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.02rem; }

    .film-cat {
      font-weight: 700;
      font-size: 0.6rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--orange);
    }

    .film-title { font-family: var(--serif); font-weight: 700; font-size: 0.94rem; line-height: 1.26; }

    .fcheck {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      font-weight: 700;
      font-size: 0.72rem;
      color: #fff;
      background: var(--green);
      border: 2px solid var(--ink);
      border-radius: 50%;
    }

    .side-foot {
      flex-shrink: 0;
      display: flex;
      gap: 0.5rem;
      padding: 0.8rem 0.85rem;
      border-top: 2px solid var(--ink);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.5rem 1rem;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 0.82rem;
      color: var(--ink);
      background: var(--cream-card);
      border: 2px solid var(--ink);
      border-radius: 12px;
      box-shadow: 3px 3px 0 0 var(--ink);
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 0 var(--ink); }
    .btn:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0 0 var(--ink); }
    .btn.solid { background: var(--orange); color: #fff; }
    .side-foot .btn { flex: 1; }

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 33;
      background: rgba(44, 24, 16, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /* ── Stage ── */

    .stage {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 0 clamp(1rem, 3.5vw, 2.4rem);
    }

    .stage-top {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.9rem;
      padding: 0.85rem 0;
    }

    .stage-title { display: flex; align-items: center; gap: 0.8rem; min-width: 0; }

    .stage-title img { height: 28px; width: auto; }

    .stage-title .txt {
      font-family: var(--sc);
      font-weight: 700;
      font-size: 1.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stage-title .txt .accent { color: var(--orange); }

    .stage-actions { display: flex; align-items: center; gap: 0.6rem; }

    .progress-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 0.9rem;
      font-weight: 700;
      font-size: 0.8rem;
      background: var(--cream-card);
      border: 2px solid var(--ink);
      border-radius: 999px;
      box-shadow: 3px 3px 0 0 var(--ink);
      white-space: nowrap;
    }

    .progress-pill .dot { color: var(--green); }

    .stage-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      padding-bottom: 1.1rem;
    }

    .now {
      max-width: min(100%, 920px);
      width: 100%;
      display: none;
      align-items: baseline;
      gap: 0.7rem;
      padding: 0 0.2rem;
    }

    .now.show { display: flex; }

    .now .cat {
      font-weight: 700;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--orange);
      white-space: nowrap;
    }

    .now .title {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1.08rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player {
      position: relative;
      width: min(100%, 920px);
      aspect-ratio: 16 / 9;
      max-height: calc(100% - 110px);
      background: #171310;
      border: 2px solid var(--ink);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 8px 8px 0 0 var(--ink);
    }

    .player video { width: 100%; height: 100%; display: block; background: #171310; }

    .player-idle {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      text-align: center;
      background: var(--cream-card);
      transition: opacity 0.3s, visibility 0.3s;
      padding: 1.2rem;
    }

    .player-idle.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .player-idle .big { font-family: var(--sc); font-weight: 900; font-size: clamp(1.3rem, 3vw, 2rem); }
    .player-idle .big .accent { color: var(--orange); }
    .player-idle .small { font-weight: 500; font-size: 0.9rem; color: var(--ink-soft); }

    .stage-nav {
      width: min(100%, 920px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
    }

    .lb-count { font-weight: 700; font-size: 0.85rem; color: var(--ink-soft); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.3rem;
      transform: translate(-50%, 250%);
      z-index: 60;
      padding: 0.75rem 1.2rem;
      font-weight: 500;
      font-size: 0.88rem;
      color: var(--ink);
      background: var(--cream-card);
      border: 2px solid var(--ink);
      border-radius: 12px;
      box-shadow: 5px 5px 0 0 var(--ink);
      transition: transform 0.35s var(--ease);
      max-width: min(92vw, 480px);
      text-align: center;
    }

    .toast.show { transform: translate(-50%, 0); }

    :focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

    @media (max-width: 700px) {
      body.sb-open .backdrop { opacity: 1; pointer-events: auto; }
      .stage-title .txt { display: none; }
      .stage-nav .btn { padding: 0.5rem 0.8rem; }
    }
  </style>
</head>

          <span class="film-text">
            <span class="film-cat">Best Dance Film</span>
            <span class="film-title">Schumann: A Love Story</span>
          </span>
          <span class="fcheck" hidden aria-label="Watched">&#10003;</span>
        </button>
    </nav>
    <div class="side-foot">
      <a class="btn" href="/">&larr; Home</a>
      <a class="btn solid" href="/winners.html">All winners</a>
    </div>
  </aside>

  <main class="stage">
    <div class="stage-top">
      <div class="stage-title">
        <img src="images/freedom.png" alt="">
        <span class="txt">Screening <span class="accent">Room</span></span>
      </div>
      <div class="stage-actions">
        <span class="progress-pill"><span class="dot">&#9679;</span>&nbsp;<span id="watchedCount">0</span>/26 watched</span>
        <button class="btn solid" id="playAll" type="button">&#9654;&nbsp;Play all</button>
      </div>
    </div>
    <div class="stage-body">
      <div class="now" id="now">
        <span class="cat" id="nowCat"></span>
        <span class="title" id="nowTitle"></span>
      </div>
      <div class="player">
        <video id="video" controls controlsList="nodownload" playsinline preload="metadata"></video>
        <div class="player-idle" id="idle">
          <div class="big">Pick a film <span class="accent">from the list</span></div>
          <div class="small">The list slides in from the left edge whenever you need it.</div>
        </div>
      </div>
      <div class="stage-nav">
        <button class="btn" id="prevBtn" type="button">&larr; Previous</button>
        <span class="lb-count" id="count">&nbsp;</span>
        <button class="btn" id="nextBtn" type="button">Next &rarr;</button>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script>
  (function () {
    var FILMS = [{"t": "Memento Mori", "c": "Best Film — Short", "s": "/videos/memento-mori.mp4"}, {"t": "Our Monsters", "c": "Best Director — Short", "s": "/videos/our-monsters.mp4"}, {"t": "Moments From Motherhood / Krystyn Sayre", "c": "Best Actress — Short", "s": "/videos/moments-from-motherhood.mp4"}, {"t": "Shelf Life", "c": "Best Script — Short", "s": "/videos/shelf-life.mp4"}, {"t": "Bus No. 9", "c": "Best Narrative — Short", "s": "/videos/bus-no-9.mp4"}, {"t": "Dionysos Avignon In Flesh And Shadow", "c": "Best Documentary — Short", "s": "/videos/dionysos-avignon-in-flesh-and-shadow.mp4"}, {"t": "Michel Steiner 64 Agendas", "c": "Best Experimental — Short", "s": "/videos/michel-steiner-64-agendas.mp4"}, {"t": "Limited Slip", "c": "Best Sci-Fi Or Fantasy — Short", "s": "/videos/limited-slip.mp4"}, {"t": "Wolf At The Crossroads", "c": "Best Thriller — Short", "s": "/videos/wolf-at-the-crossroads.mp4"}, {"t": "The Master Puppeteer", "c": "Best Comedy — Short", "s": "/videos/the-master-puppeteer.mp4"}, {"t": "Faithless", "c": "Best Drama — Short", "s": "/videos/faithless.mp4"}, {"t": "The Collector", "c": "Best Horror — Short", "s": "/videos/the-collector.mp4"}, {"t": "Words From The Midnight Monster", "c": "Best Ultra-Short (Under 3 Minutes)", "s": "/videos/words-from-the-midnight-monster.mp4"}, {"t": "Music In The Air", "c": "Best Producer — Short", "s": "/videos/music-in-the-air.mp4"}, {"t": "The Harpies", "c": "Best Cinematography — Short", "s": "/videos/the-harpies.mp4"}, {"t": "First String 2: The Greenwood 20: Quest For The Great Dante", "c": "Best Film — Feature · Best Drama — Feature", "s": "/videos/first-string-2-the-greenwood-20-quest-for-the-great-dante.mp4"}, {"t": "Together For Water", "c": "Best Documentary — Feature", "s": "/videos/together-for-water.mp4"}, {"t": "Our Brilliant Destruction", "c": "Best Experimental — Feature", "s": "/videos/our-brilliant-destruction.mp4"}, {"t": "60 Days", "c": "Best Comedy — Feature", "s": "/videos/60-days.mp4"}, {"t": "First String 2: The Greenwood 20: Quest For The Great Dante", "c": "Best Film — Feature · Best Drama — Feature", "s": "/videos/first-string-2-the-greenwood-20-quest-for-the-great-dante.mp4"}, {"t": "Colombano &amp; La 21Esima Fetta", "c": "Best Cinematography — Feature", "s": "/videos/colombano-and-la-21esima-fetta.mp4"}, {"t": "The Dandelion Girl", "c": "Best First-Time Filmmaker", "s": "/videos/the-dandelion-girl.mp4"}, {"t": "Sexy City Lights", "c": "Best Music Video", "s": "/videos/sexy-city-lights.mp4"}, {"t": "The Killers Journalist", "c": "Best Web Series / Pilot Episode", "s": "/videos/the-killers-journalist.mp4"}, {"t": "The Cowgirl", "c": "Best Student Film", "s": "/videos/the-cowgirl.mp4"}, {"t": "Schumann: A Love Story", "c": "Best Dance Film", "s": "/videos/schumann-a-love-story.mp4"}];
    var video = document.getElementById('video');
    var idle = document.getElementById('idle');
    var now = document.getElementById('now');
    var nowCat = document.getElementById('nowCat');
    var nowTitle = document.getElementById('nowTitle');
    var count = document.getElementById('count');
    var toast = document.getElementById('toast');
    var watchedCount = document.getElementById('watchedCount');
    var sidebar = document.getElementById('sidebar');
    var rows = [].slice.call(document.querySelectorAll('.film-row'));
    var current = -1, toastT, hideT;

    var watched = {};
    try { watched = JSON.parse(localStorage.getItem('iiff-s6-watched') || '{}'); } catch (e) {}

    function renderWatched() {
      var n = 0;
      rows.forEach(function (r, i) {
        var w = !!watched[i];
        if (w) n++;
        r.querySelector('.fcheck').hidden = !w;
      });
      watchedCount.textContent = n;
    }

    function markWatched(i) {
      watched[i] = true;
      try { localStorage.setItem('iiff-s6-watched', JSON.stringify(watched)); } catch (e) {}
      renderWatched();
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastT);
      toastT = setTimeout(function () { toast.classList.remove('show'); }, 3500);
    }

    function setSidebar(open) {
      document.body.classList.toggle('sb-open', open);
    }

    document.getElementById('peek').addEventListener('click', function () { setSidebar(true); });
    document.getElementById('sideClose').addEventListener('click', function () { setSidebar(false); });
    document.getElementById('backdrop').addEventListener('click', function () { setSidebar(false); });
    document.getElementById('edgeZone').addEventListener('mouseenter', function () { setSidebar(true); });

    // auto-hide: when the pointer leaves the open sidebar (desktop), tuck it away
    sidebar.addEventListener('mouseleave', function () {
      if (current === -1) return; // keep it out while nothing is playing
      clearTimeout(hideT);
      hideT = setTimeout(function () { setSidebar(false); }, 600);
    });
    sidebar.addEventListener('mouseenter', function () { clearTimeout(hideT); });

    function play(i) {
      if (i < 0 || i >= FILMS.length) return;
      current = i;
      var f = FILMS[i];
      rows.forEach(function (r, j) { r.classList.toggle('active', j === i); });
      nowCat.textContent = f.c;
      nowTitle.textContent = f.t;
      now.classList.add('show');
      count.textContent = (i + 1) + ' / ' + FILMS.length;
      idle.classList.add('hidden');
      video.src = f.s;
      video.load();
      var p = video.play();
      if (p && p.catch) p.catch(function () {});
      rows[i].scrollIntoView({ block: 'nearest' });
      clearTimeout(hideT);
      hideT = setTimeout(function () { setSidebar(false); }, 450); // auto-hide after choosing
    }

    rows.forEach(function (r) {
      r.addEventListener('click', function () { play(parseInt(r.getAttribute('data-i'), 10)); });
    });

    document.getElementById('playAll').addEventListener('click', function () { play(0); });
    document.getElementById('prevBtn').addEventListener('click', function () { if (current > 0) play(current - 1); });
    document.getElementById('nextBtn').addEventListener('click', function () { if (current + 1 < FILMS.length) play(current + 1); });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') setSidebar(false);
      if (e.key === 'ArrowRight' && current > -1 && current + 1 < FILMS.length) play(current + 1);
      if (e.key === 'ArrowLeft' && current > 0) play(current - 1);
    });

    video.addEventListener('ended', function () {
      if (current > -1) markWatched(current);
      if (current + 1 < FILMS.length) {
        showToast('Up next: ' + FILMS[current + 1].t);
        play(current + 1);
      } else {
        showToast('That was the last film \u2014 thanks for watching Season Six!');
      }
    });

    video.addEventListener('error', function () {
      if (current === -1 || !video.getAttribute('src')) return;
      showToast('\u201C' + FILMS[current].t + '\u201D isn\u2019t available yet \u2014 check back soon.');
    });

    renderWatched();
  })();
  </script>
</body>
</html>
