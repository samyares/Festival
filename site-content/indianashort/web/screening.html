<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Screening Room — Season Six · Indiana Independent Film Festival</title>
  <meta name="description" content="The Indiana Independent Film Festival screening room — watch the Season Six winning films.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Oswald:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/freedom.png">
  <style>
    :root {
      --bg: #0f1014;
      --bg-side: #131419;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --ink: #f2f1ee;
      --muted: #9c9aa3;
      --muted-2: #6d6b75;
      --brand-1: #e63c64;
      --brand-2: #14b3a6;
      --brand-3: #9678c8;
      --brand-4: #7fb6dc;
      --brand-5: #f0842e;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      --label: 'Oswald', var(--sans);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --sidebar-w: 360px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
      display: flex;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Sidebar ── */

    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg-side);
      border-right: 1px solid var(--border);
      z-index: 30;
    }

    .side-rainbow {
      height: 4px;
      flex-shrink: 0;
      background: linear-gradient(90deg,
        var(--brand-1) 0 20%, var(--brand-2) 0 40%, var(--brand-3) 0 60%,
        var(--brand-4) 0 80%, var(--brand-5) 0 100%);
    }

    .side-head {
      flex-shrink: 0;
      padding: 1.1rem 1.2rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .brand { display: flex; align-items: center; gap: 0.7rem; text-decoration: none; margin-bottom: 1.1rem; }
    .brand img { height: 24px; width: auto; display: block; }
    .brand span {
      font-family: var(--label);
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .side-eyebrow {
      margin: 0 0 0.25rem;
      font-family: var(--label);
      font-weight: 300;
      font-size: 0.68rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--brand-5);
    }

    .side-title {
      margin: 0;
      font-family: var(--serif);
      font-weight: 800;
      font-size: 1.7rem;
      line-height: 1.05;
    }

    .side-meta {
      margin: 0.35rem 0 0;
      font-family: var(--label);
      font-weight: 300;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted-2);
    }

    /* ── Film list ── */

    .films {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }

    .films::-webkit-scrollbar { width: 8px; }
    .films::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }

    .film-row {
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
      width: 100%;
      padding: 0.7rem 1rem 0.7rem 1.2rem;
      background: none;
      border: 0;
      border-left: 3px solid transparent;
      border-bottom: 1px solid var(--border);
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .film-row:hover { background: rgba(255, 255, 255, 0.04); }

    .film-row.active {
      background: rgba(255, 255, 255, 0.06);
      border-left-color: var(--a, var(--brand-1));
    }

    .film-no {
      font-family: var(--label);
      font-weight: 300;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--muted-2);
      min-width: 1.5rem;
      padding-top: 0.2rem;
    }

    .film-row.active .film-no { color: var(--a, var(--brand-1)); }

    .film-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.05rem; }

    .film-cat {
      font-family: var(--label);
      font-weight: 400;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--a, var(--brand-1));
      opacity: 0.9;
    }

    .film-title {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 0.98rem;
      line-height: 1.3;
    }

    .side-foot {
      flex-shrink: 0;
      display: flex;
      gap: 0.5rem;
      padding: 0.9rem 1.2rem;
      border-top: 1px solid var(--border);
    }

    .chip {
      flex: 1;
      text-align: center;
      padding: 0.5rem 0.6rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      white-space: nowrap;
    }

    .chip:hover { color: var(--ink); border-color: var(--border-strong); background: rgba(255,255,255,0.04); }

    /* ── Stage ── */

    .stage {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(150, 120, 200, 0.10), transparent 65%),
        var(--bg);
    }

    .stage-top {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem clamp(1rem, 3vw, 2rem);
    }

    .toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      background: var(--bg-side);
      color: var(--ink);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .now {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .now.show { opacity: 1; }

    .now .cat {
      font-family: var(--label);
      font-weight: 400;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--np, var(--brand-1));
      white-space: nowrap;
    }

    .now .title {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1.05rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stage-body {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 clamp(1rem, 3vw, 2rem) clamp(1rem, 3vh, 1.6rem);
    }

    .player {
      position: relative;
      width: 100%;
      max-width: min(100%, calc((100vh - 160px) * 16 / 9));
      aspect-ratio: 16 / 9;
      background: #000;
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 40px 90px -35px rgba(0, 0, 0, 0.95);
    }

    .player video { width: 100%; height: 100%; display: block; background: #000; }

    .player-idle {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      text-align: center;
      background:
        radial-gradient(ellipse 70% 60% at 50% 40%, rgba(150, 120, 200, 0.14), transparent 70%),
        #101116;
      transition: opacity 0.3s, visibility 0.3s;
      padding: 1rem;
    }

    .player-idle.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .player-idle .big {
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(1.1rem, 2.6vw, 1.7rem);
    }

    .player-idle .small {
      font-family: var(--label);
      font-weight: 300;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .player-idle .rule {
      width: 60px;
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(90deg,
        var(--brand-1) 0 20%, var(--brand-2) 0 40%, var(--brand-3) 0 60%,
        var(--brand-4) 0 80%, var(--brand-5) 0 100%);
    }

    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 25;
      background: rgba(10, 10, 12, 0.6);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.4rem;
      transform: translate(-50%, 200%);
      z-index: 40;
      padding: 0.8rem 1.3rem;
      font-size: 0.88rem;
      color: var(--ink);
      background: #1d1f28;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.8);
      transition: transform 0.35s var(--ease);
      max-width: min(92vw, 480px);
      text-align: center;
    }

    .toast.show { transform: translate(-50%, 0); }

    :focus-visible { outline: 2px solid var(--brand-4); outline-offset: 2px; }

    /* ── Mobile: off-canvas sidebar ── */

    @media (max-width: 899px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: min(84vw, 340px);
        transform: translateX(-102%);
        transition: transform 0.35s var(--ease);
        box-shadow: 30px 0 80px -30px rgba(0, 0, 0, 0.9);
      }

      .sidebar.open { transform: translateX(0); }

      .toggle { display: inline-flex; }

      body.drawer-open .backdrop { display: block; }
    }
  </style>
</head>
