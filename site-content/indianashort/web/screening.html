<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screening Room — Season Six · Indiana Independent Film Festival</title>
  <meta name="description" content="The Indiana Independent Film Festival screening room — watch the Season Six winning films.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@700;900&family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/freedom.png">
  <style>
    :root {
      --cream: #faf3e7;
      --cream-card: #fffaf2;
      --ink: #2c1810;
      --ink-soft: #6b5a4e;
      --orange: #ff6b35;
      --orange-soft: #ffe3d6;
      --sc: 'Playfair Display SC', Georgia, serif;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --sidebar-w: 370px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */

    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--cream);
      border-right: 2px solid var(--ink);
      z-index: 30;
    }

    .side-head {
      flex-shrink: 0;
      padding: 1.1rem 1.2rem 1rem;
      border-bottom: 2px solid var(--ink);
    }

    .brand { display: flex; align-items: center; gap: 0.7rem; text-decoration: none; color: var(--ink); margin-bottom: 1rem; }
    .brand img { height: 26px; width: auto; display: block; }
    .brand span {
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.32rem 0.8rem;
      font-weight: 700;
      font-size: 0.72rem;
      background: var(--cream-card);
      border: 2px solid var(--ink);
      border-radius: 9px;
      box-shadow: 2px 2px 0 0 var(--ink);
      margin-bottom: 0.7rem;
    }

    .badge .star { color: var(--orange); }

    .side-title {
      margin: 0;
      font-family: var(--sc);
      font-weight: 900;
      font-size: 1.75rem;
      line-height: 1.05;
    }

    .side-title .accent { color: var(--orange); }

    .side-meta {
      margin: 0.3rem 0 0;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--ink-soft);
    }

    /* ── Film list ── */

    .films {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(44, 24, 16, 0.35) transparent;
      padding: 0.7rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .film-row {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      width: 100%;
      padding: 0.6rem 0.75rem;
      background: var(--cream-card);
      border: 2px solid var(--ink);
      border-radius: 12px;
      box-shadow: 3px 3px 0 0 var(--ink);
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .film-row:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 0 var(--ink); }

    .film-row.active {
      background: var(--orange);
      color: #fff;
    }

    .film-row.active .film-cat { color: #fff; opacity: 0.9; }
    .film-row.active .film-no { color: #fff; background: rgba(255,255,255,0.2); border-color: #fff; }

    .film-no {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.9rem;
      height: 1.9rem;
      font-weight: 700;
      font-size: 0.72rem;
      color: var(--ink);
      background: var(--orange-soft);
      border: 2px solid var(--ink);
      border-radius: 8px;
    }

    .film-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.05rem; }

    .film-cat {
      font-weight: 700;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--orange);
    }

    .film-title {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 0.96rem;
      line-height: 1.28;
    }

    .side-foot {
      flex-shrink: 0;
      display: flex;
      gap: 0.55rem;
      padding: 0.85rem 0.9rem;
      border-top: 2px solid var(--ink);
    }

    .btn {
      flex: 1;
      text-align: center;
      padding: 0.5rem 0.8rem;
      font-weight: 700;
      font-size: 0.82rem;
      color: var(--ink);
      background: var(--cream-card);
      border: 2px solid var(--ink);
      border-radius: 12px;
      box-shadow: 3px 3px 0 0 var(--ink);
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 0 var(--ink); }
    .btn.solid { background: var(--orange); color: #fff; }

    /* ── Stage ── */

    .stage {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--cream);
    }

    .stage-top {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.9rem clamp(1rem, 3vw, 2rem);
    }

    .toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: var(--cream-card);
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 12px;
      box-shadow: 3px 3px 0 0 var(--ink);
      cursor: pointer;
      flex-shrink: 0;
    }

    .now {
      min-width: 0;
      display: none;
      align-items: center;
      gap: 0.7rem;
      padding: 0.45rem 1rem;
      background: var(--cream-card);
      border: 2px solid var(--ink);
      border-radius: 12px;
      box-shadow: 3px 3px 0 0 var(--ink);
    }

    .now.show { display: flex; }

    .now .cat {
      font-weight: 700;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--orange);
      white-space: nowrap;
    }

    .now .title {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stage-body {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 clamp(1rem, 3vw, 2rem) clamp(1.2rem, 3vh, 1.8rem);
    }

    .player {
      position: relative;
      width: 100%;
      max-width: min(100%, calc((100vh - 170px) * 16 / 9));
      aspect-ratio: 16 / 9;
      background: #171310;
      border: 2px solid var(--ink);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 8px 8px 0 0 var(--ink);
    }

    .player video { width: 100%; height: 100%; display: block; background: #171310; }

    .player-idle {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      text-align: center;
      background: var(--cream-card);
      transition: opacity 0.3s, visibility 0.3s;
      padding: 1rem;
    }

    .player-idle.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .player-idle .big {
      font-family: var(--sc);
      font-weight: 700;
      font-size: clamp(1.2rem, 2.8vw, 1.9rem);
    }

    .player-idle .big .accent { color: var(--orange); }

    .player-idle .small {
      font-weight: 500;
      font-size: 0.85rem;
      color: var(--ink-soft);
    }

    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 25;
      background: rgba(44, 24, 16, 0.45);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.4rem;
      transform: translate(-50%, 250%);
      z-index: 40;
      padding: 0.75rem 1.2rem;
      font-weight: 500;
      font-size: 0.88rem;
      color: var(--ink);
      background: var(--cream-card);
      border: 2px solid var(--ink);
      border-radius: 12px;
      box-shadow: 5px 5px 0 0 var(--ink);
      transition: transform 0.35s var(--ease);
      max-width: min(92vw, 480px);
      text-align: center;
    }

    .toast.show { transform: translate(-50%, 0); }

    :focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

    @media (max-width: 899px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: min(86vw, 350px);
        transform: translateX(-104%);
        transition: transform 0.35s var(--ease);
        box-shadow: 6px 0 0 0 var(--ink);
      }

      .sidebar.open { transform: translateX(0); }

      .toggle { display: inline-flex; }

      body.drawer-open .backdrop { display: block; }
    }
  </style>
</head>

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastT);
      toastT = setTimeout(function () { toast.classList.remove('show'); }, 3500);
    }

    function setDrawer(open) {
      sidebar.classList.toggle('open', open);
      document.body.classList.toggle('drawer-open', open);
      toggle.setAttribute('aria-expanded', String(open));
    }

    toggle.addEventListener('click', function () { setDrawer(!sidebar.classList.contains('open')); });
    backdrop.addEventListener('click', function () { setDrawer(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setDrawer(false); });

    function play(i) {
      if (i < 0 || i >= FILMS.length) return;
      current = i;
      var f = FILMS[i];
      rows.forEach(function (r, j) { r.classList.toggle('active', j === i); });
      nowCat.textContent = f.c;
      nowTitle.textContent = f.t;
      now.classList.add('show');
      idle.classList.add('hidden');
      video.src = f.s;
      video.load();
      var p = video.play();
      if (p && p.catch) p.catch(function () {});
      rows[i].scrollIntoView({ block: 'nearest' });
      if (window.innerWidth < 900) setDrawer(false);
    }

    rows.forEach(function (r) {
      r.addEventListener('click', function () { play(parseInt(r.getAttribute('data-i'), 10)); });
    });

    video.addEventListener('ended', function () {
      if (current + 1 < FILMS.length) {
        showToast('Up next: ' + FILMS[current + 1].t);
        play(current + 1);
      }
    });

    video.addEventListener('error', function () {
      if (current === -1) return;
      showToast('\u201C' + FILMS[current].t + '\u201D isn\u2019t available yet \u2014 check back soon.');
      idle.classList.remove('hidden');
    });
  })();
  </script>
</body>
</html>
