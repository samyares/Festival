server {                                              
    listen       80;                                  
    listen  [::]:80;                                  
    server_name  indiana2;                           
                                                                                           
    location / {                            
        root   /usr/share/nginx/html;       
        index  index.html index.htm;                          
    }

    location = /winners-may2026.html  { return 301 /winners.html#season-six; }
    location = /winners-jan2026.html  { return 301 /winners.html#season-five; }
    location = /winners-sept2025.html { return 301 /winners.html#season-four; }
    location = /winners-may2025.html  { return 301 /winners.html#season-three; }
    location = /winners-dec2024.html  { return 301 /winners.html#season-two; }
    location = /winners-aug2024.html  { return 301 /winners.html#season-one; }  

    location /certs/ {
        alias /var/www/html/certs/;
        autoindex on; 
    }                                                        
                                                              
    location /videos/ {
        alias /var/www/html/videos/;
        autoindex on; 
    }                                     
}                                                               



server {
    listen       80;
    listen  [::]:80;
    server_name  screening.indianafes.info;
    return 301 https://indianafes.info/screening.html;
}
