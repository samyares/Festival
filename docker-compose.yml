      - "traefik.http.routers.londonwomen-www.entrypoints=websecure"
      - "traefik.http.routers.londonwomen-www.tls=true"
      - "traefik.http.routers.londonwomen-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.londonwomen-www.service=londonwomen"
      - "traefik.http.routers.londonwomen-www.middlewares=londonwomen-www-to-apex"
      - "traefik.http.middlewares.londonwomen-www-to-apex.redirectregex.regex=^https://www\\.londonwomenfilmfestival\\.info/(.*)"
