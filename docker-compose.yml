      - "traefik.http.routers.frameofnewyork.entrypoints=websecure"
      - "traefik.http.routers.frameofnewyork.tls=true"
      - "traefik.http.routers.frameofnewyork.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frameofnewyork.service=frameofnewyork"
      - "traefik.http.services.frameofnewyork.loadbalancer.server.port=80"
      # www.framesofnewyork.online -> framesofnewyork.online (keeps path + query)
      - "traefik.http.routers.frameofnewyork-www.rule=Host(`www.framesofnewyork.online`)"
      - "traefik.http.routers.frameofnewyork-www.entrypoints=websecure"
      - "traefik.http.routers.frameofnewyork-www.tls=true"
      - "traefik.http.routers.frameofnewyork-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frameofnewyork-www.service=frameofnewyork"
      - "traefik.http.routers.frameofnewyork-www.middlewares=frameofnewyork-www-to-apex"
      - "traefik.http.middlewares.frameofnewyork-www-to-apex.redirectregex.regex=^https://www\\.framesofnewyork\\.online/(.*)"
      - "traefik.http.middlewares.frameofnewyork-www-to-apex.redirectregex.replacement=https://framesofnewyork.online/$${1}"
      - "traefik.http.middlewares.frameofnewyork-www-to-apex.redirectregex.permanent=true"

