volumes:
  londonwomen_node_modules:
  londonwomen_next:

networks:
  proxy:
    external: true
    name: proxy

services:
  pariswomencinefest:
    image: nginx:alpine
    container_name: pariswomencinefest
    restart: unless-stopped
    volumes:
      - ./site-content/pariswomencinefest/web:/usr/share/nginx/html
      - ./site-content/pariswomencinefest/nginx:/etc/nginx/conf.d
      - ./site-content/pariswomencinefest/certs:/var/www/html/certs
      - ./site-content/pariswomencinefest/movies:/var/www/html/movies
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.pariswomencinefest.rule=Host(`pwcf.info`)"
      - "traefik.http.routers.pariswomencinefest.entrypoints=websecure"
      - "traefik.http.routers.pariswomencinefest.tls=true"
      - "traefik.http.routers.pariswomencinefest.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pariswomencinefest.service=pariswomencinefest"
      - "traefik.http.services.pariswomencinefest.loadbalancer.server.port=80"
      # www.pwcf.info -> pwcf.info (keeps path + query)
      - "traefik.http.routers.pariswomencinefest-www.rule=Host(`www.pwcf.info`)"
      - "traefik.http.routers.pariswomencinefest-www.entrypoints=websecure"
      - "traefik.http.routers.pariswomencinefest-www.tls=true"
      - "traefik.http.routers.pariswomencinefest-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pariswomencinefest-www.service=pariswomencinefest"
      - "traefik.http.routers.pariswomencinefest-www.middlewares=pariswomencinefest-www-to-apex"
      - "traefik.http.middlewares.pariswomencinefest-www-to-apex.redirectregex.regex=^https://www\\.pwcf\\.info/(.*)"
      - "traefik.http.middlewares.pariswomencinefest-www-to-apex.redirectregex.replacement=https://pwcf.info/$${1}"
      - "traefik.http.middlewares.pariswomencinefest-www-to-apex.redirectregex.permanent=true"

  indianashort:
    image: nginx:alpine
    container_name: indianashort
    restart: unless-stopped
    volumes:
      - ./site-content/indianashort/web:/usr/share/nginx/html
      - ./site-content/indianashort/nginx:/etc/nginx/conf.d
      # - ./site-content/indianashort/movies:/var/www/html/videos
      - ./site-content/indianashort/certs:/var/www/html/certs
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.indianashort.rule=Host(`indianafes.info`)"
      - "traefik.http.routers.indianashort.entrypoints=websecure"
      - "traefik.http.routers.indianashort.tls=true"
      - "traefik.http.routers.indianashort.tls.certresolver=letsencrypt"
      - "traefik.http.routers.indianashort.service=indianashort"
      - "traefik.http.services.indianashort.loadbalancer.server.port=80"
      # www.indianafes.info -> indianafes.info (keeps path + query)
      - "traefik.http.routers.indianashort-www.rule=Host(`www.indianafes.info`)"
      - "traefik.http.routers.indianashort-www.entrypoints=websecure"
      - "traefik.http.routers.indianashort-www.tls=true"
      - "traefik.http.routers.indianashort-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.indianashort-www.service=indianashort"
      - "traefik.http.routers.indianashort-www.middlewares=indianashort-www-to-apex"
      - "traefik.http.middlewares.indianashort-www-to-apex.redirectregex.regex=^https://www\\.indianafes\\.info/(.*)"
      - "traefik.http.middlewares.indianashort-www-to-apex.redirectregex.replacement=https://indianafes.info/$${1}"
      - "traefik.http.middlewares.indianashort-www-to-apex.redirectregex.permanent=true"

