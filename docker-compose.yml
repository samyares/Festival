      - "traefik.http.routers.californiawomen.tls=true"
      - "traefik.http.routers.californiawomen.tls.certresolver=letsencrypt"
      - "traefik.http.routers.californiawomen.service=californiawomen"
      - "traefik.http.services.californiawomen.loadbalancer.server.port=80"
      # www.cawff.online -> cawff.online (keeps path + query)
      - "traefik.http.routers.californiawomen-www.rule=Host(`www.cawff.online`)"
      - "traefik.http.routers.californiawomen-www.entrypoints=websecure"
      - "traefik.http.routers.californiawomen-www.tls=true"
