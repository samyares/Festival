    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.ottawa.rule=Host(`ottawafilm.site`)"
      - "traefik.http.routers.ottawa.entrypoints=websecure"
      - "traefik.http.routers.ottawa.tls=true"
      - "traefik.http.routers.ottawa.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ottawa.service=ottawa"
      - "traefik.http.services.ottawa.loadbalancer.server.port=80"
      - "traefik.http.routers.ottawa-www.rule=Host(`www.ottawafilm.site`)"
      - "traefik.http.routers.ottawa-www.entrypoints=websecure"
      - "traefik.http.routers.ottawa-www.tls=true"
      - "traefik.http.routers.ottawa-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ottawa-www.service=ottawa"
      - "traefik.http.routers.ottawa-www.middlewares=ottawa-www-to-apex"
      - "traefik.http.middlewares.ottawa-www-to-apex.redirectregex.regex=^https://www\\.ottawafilm\\.site/(.*)"
      - "traefik.http.middlewares.ottawa-www-to-apex.redirectregex.replacement=https://ottawafilm.site/$${1}"
      - "traefik.http.middlewares.ottawa-www-to-apex.redirectregex.permanent=true"

  frameofnewyork:
    image: nginx:alpine
    container_name: frameofnewyork
    restart: unless-stopped
    volumes:
      - ./site-content/frameofnewyork/web:/usr/share/nginx/html
      - ./site-content/frameofnewyork/nginx:/etc/nginx/conf.d
